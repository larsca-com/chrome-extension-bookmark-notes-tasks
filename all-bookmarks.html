<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Bookmarks - Notes & Tasks</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="all-bookmarks.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app">
    <!-- Nav -->
    <nav class="nav">
      <div class="nav-inner">
        <div class="nav-brand">
          <svg class="nav-logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v18l-7-4-7 4V4z" fill="currentColor"/>
          </svg>
          <span class="nav-title">Bookmark Notes & Tasks</span>
        </div>
        <div class="nav-meta">
          <span class="bookmark-total" id="bookmark-total">0 bookmarks</span>
          <button class="nav-btn" id="export-json" title="Download all bookmarks with their notes and tasks as a JSON file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M7 10l5 5 5-5"/>
              <path d="M12 15V3"/>
            </svg>
            Export JSON
          </button>
          <div class="theme-switch" role="radiogroup" aria-label="Theme">
            <button class="theme-opt" data-theme-option="system" role="radio" title="System theme" aria-label="System theme">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            </button>
            <button class="theme-opt" data-theme-option="light" role="radio" title="Light theme" aria-label="Light theme">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            </button>
            <button class="theme-opt" data-theme-option="dark" role="radio" title="Dark theme" aria-label="Dark theme">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Search + Filters -->
    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search bookmarks, notes, or tasks...">
          <kbd class="search-kbd">Ctrl+K</kbd>
        </div>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="has-notes">With Notes</button>
          <button class="filter-btn" data-filter="has-tasks">With Tasks</button>
          <button class="filter-btn" data-filter="has-pending">Pending Tasks</button>
        </div>
      </div>
    </div>

    <!-- Bookmark List -->
    <main class="main">
      <div class="bookmark-grid" id="bookmark-grid">
        <!-- Rendered by JS -->
      </div>

      <!-- Empty State -->
      <div class="empty hidden" id="empty-state">
        <div class="empty-icon-large">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
            <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v18l-7-4-7 4V4z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </div>
        <h2 class="empty-heading" id="empty-heading">No bookmarks yet</h2>
        <p class="empty-desc" id="empty-desc">Visit a page and click the extension to bookmark it with notes and tasks.</p>
      </div>
    </main>
  </div>

  <!-- Modal for editing -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="modal-page-info">
          <div class="modal-favicon" id="modal-favicon"></div>
          <div class="modal-page-details">
            <h3 class="modal-page-title" id="modal-page-title"></h3>
            <a class="modal-page-url" id="modal-page-url" href="#" target="_blank" rel="noopener" title="Open in new tab"></a>
          </div>
        </div>
        <button class="modal-open" id="modal-open" title="Open in new tab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M15 3h6v6"/>
            <path d="M10 14L21 3"/>
          </svg>
          Open
        </button>
        <button class="modal-close" id="modal-close" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <label class="modal-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            Notes
          </label>
          <textarea class="modal-notes" id="modal-notes" placeholder="Write notes..." rows="3"></textarea>
        </div>
        <div class="modal-section">
          <label class="modal-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            Tasks
          </label>
          <ul class="modal-task-list" id="modal-task-list"></ul>
          <div class="modal-task-add">
            <input type="text" class="modal-task-input" id="modal-task-input" placeholder="Add a task...">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn-delete" id="modal-delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          Remove Bookmark
        </button>
        <button class="modal-btn-save" id="modal-save">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="all-bookmarks.js"></script>
</body>
</html>
