<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Notes & Tasks</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v18l-7-4-7 4V4z" fill="currentColor"/>
        </svg>
        <h1 class="logo-text">Notes & Tasks</h1>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-all-bookmarks" title="All Bookmarks">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info Bar -->
    <div class="page-info" id="page-info">
      <div class="page-favicon" id="page-favicon"></div>
      <div class="page-details">
        <span class="page-title" id="page-title">Loading...</span>
        <span class="page-url" id="page-url"></span>
      </div>
    </div>

    <!-- Main Content -->
    <main class="content">
      <!-- Un-bookmarked State -->
      <div class="state-unbookmarked" id="state-unbookmarked">
        <div class="empty-state">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
              <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v18l-7-4-7 4V4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 8v4M10 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="empty-text">This page isn't bookmarked yet</p>
          <p class="empty-subtext">Bookmark it to add notes and tasks</p>
          <button class="btn-primary btn-bookmark" id="btn-bookmark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v18l-7-4-7 4V4z" fill="currentColor"/>
            </svg>
            Bookmark This Page
          </button>
        </div>
      </div>

      <!-- Bookmarked State -->
      <div class="state-bookmarked hidden" id="state-bookmarked">
        <!-- Notes Section -->
        <section class="section">
          <div class="section-header">
            <div class="section-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
              </svg>
              Notes
            </div>
          </div>
          <textarea
            class="notes-input"
            id="notes-input"
            placeholder="Write your notes about this page..."
            rows="2"
          ></textarea>
        </section>

        <!-- Tasks Section -->
        <section class="section">
          <div class="section-header">
            <div class="section-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              Tasks
            </div>
            <span class="task-count" id="task-count"></span>
          </div>
          <ul class="task-list" id="task-list"></ul>
          <div class="task-input-wrap">
            <svg class="task-input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
            <input
              class="task-input"
              id="task-input"
              type="text"
              placeholder="Add your first task for this page"
            >
          </div>
        </section>

        <!-- Remove Bookmark -->
        <button class="btn-remove" id="btn-remove-bookmark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          Remove Bookmark
        </button>
      </div>

      <!-- Settings Panel -->
      <div class="state-settings hidden" id="state-settings">
        <section class="section">
          <div class="section-header">
            <div class="section-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              Sync & Backup
            </div>
          </div>
          <p class="settings-desc">Sync your bookmarks, notes, and tasks across devices. Your data will be encrypted before transfer.</p>
          <button class="btn-google" id="btn-google-login">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Login with Google
            <span class="badge-phase">Phase 2</span>
          </button>
          <div class="encryption-note">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            End-to-end encryption for all synced data
          </div>
        </section>
        <button class="btn-text-back" id="btn-back-settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back
        </button>
      </div>
    </main>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
